version: 0.1.0
title: Awesome AI Agent Landscape
updated: 2026-08-25
description: >-
  Vendor-first map of the systems used to build, run, connect,
  evaluate, and deploy AI agents.

layers:
  - id: platforms
    name: Agent platforms
    definition: Managed or model-native foundations for building and operating agents.
  - id: coding-harnesses
    name: Coding agents & harnesses
    definition: Agentic environments that plan, edit, execute, and verify work in a codebase.
  - id: frameworks
    name: Frameworks & orchestration
    definition: Code frameworks for agent state, tool use, retrieval, routing, and workflows.
  - id: runtimes
    name: Runtimes & tool execution
    definition: Sandboxes, browsers, containers, and environments that let agents act safely.
  - id: protocols
    name: Protocols & interoperability
    definition: Open interfaces that connect agents, tools, and interactive frontends.
  - id: evaluation
    name: Evaluation & observability
    definition: Tracing, testing, scoring, and production quality controls for agents.
  - id: visual-builders
    name: Visual & low-code builders
    definition: Visual surfaces for assembling and deploying agentic workflows.
  - id: benchmarks
    name: Benchmarks & research environments
    definition: Standard tasks and environments used to compare agent performance.

