version: 1.0.0
title: AI Agent Evolving
updated: 2026-08-25
purpose: >-
  A living product map showing how major AI ecosystems evolve from
  foundation models through assistants and developer agents to general work agents.

stages:
  - id: foundation-model
    name: Foundation Model
    tagline: The intelligence
    definition: The model family that supplies the underlying capability.
  - id: ai-assistant
    name: AI Assistant
    tagline: Talk to AI
    definition: An interactive product primarily driven by a user conversation.
  - id: developer-agent
    name: Developer Agent
    tagline: Engineer with AI
    definition: An agent designed to work across a software project using tools and execution.
  - id: general-work-agent
    name: General Work Agent
    tagline: Get work done with AI
    definition: An agent designed to own longer-running, cross-application work and deliverables.

ecosystems:
  - id: openai
    name: OpenAI
    positioning: Broad general intelligence and leading developer tools
    color: "#8b5cf6"
  - id: anthropic
    name: Anthropic
    positioning: AI safety pioneers and agent-harness leaders
    color: "#f59e0b"
  - id: google
    name: Google
    positioning: AI, data, and cloud advantage
    color: "#4285f4"
  - id: xai
    name: xAI
    positioning: Built for the era of agents
    color: "#22b8c7"
  - id: open-source
    name: Open Source
    positioning: Open models, open freedom
    color: "#41c656"

